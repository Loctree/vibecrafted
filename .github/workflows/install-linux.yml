name: Install (Linux Matrix)
run-name: Linux · ${{ inputs.request_id || github.sha }}

# Plan 03 (META_22) cross-platform install gate. Exercises the install.sh
# Linux path against Ubuntu (runner-native) and Debian (container) and
# verifies `vibecrafted doctor` reports green afterwards. Doctor stays green in
# headless CI because absent external foundations (loctree/aicx) are warnings.
# Owned vc-frame/vc-terminal engines must also execute on every matrix host.
#
# The Ubuntu job uses the GitHub-hosted runner directly so we exercise the
# real /etc/os-release detection and the apt-family hint path. The Debian
# job runs inside a debian:bookworm-slim container so we exercise the
# bare-minimum prereq install (no pre-baked tooling) — this is the most
# likely failure mode for a real Debian user.

on:
  # Site release dispatches this with the product key. PR and push runs keep
  # the rehearsal key and never emit a publication receipt.
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable product source Git SHA (may differ from workflow SHA)
        required: true
        type: string
      terminal_revision:
        description: Exact vc-terminal source Git SHA
        required: true
        type: string
      frame_revision:
        description: Exact vc-frame source Git SHA
        required: true
        type: string
      request_id:
        description: Unique 24-hex site-release request identity
        required: true
        type: string
      release_signing:
        description: Use the configured product key and emit the tested release artifact
        required: true
        default: true
        type: boolean
      include_arm64:
        description: Also build, install, and sign linux-arm64 on ubuntu-22.04-arm
        required: true
        default: false
        type: boolean
  # Branch pushes with an open PR are already covered by pull_request; only
  # main gets a push run so the default branch keeps its own signal.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
      - "release/*"
  # The main ruleset requires this workflow's "docker build + doctor"
  # context, and the merge queue (HEADGREEN) waits for required contexts on
  # the queue head. Without a merge_group trigger this workflow can never
  # report there, so every queued merge deadlocks until the 60-minute
  # check_response_timeout kills the entry.
  merge_group:

permissions:
  contents: read

concurrency:
  # One live run per PR: a new push to the PR cancels the superseded run.
  # Push/tag/dispatch/merge-queue runs get a unique group and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-runtime-pack:
    name: build Linux x64 Runtime Pack
    # Build against the oldest supported GNU libc. ubuntu-latest binaries
    # required GLIBC_2.38 and failed to launch on the green 22.04 install job.
    runs-on: ubuntu-22.04
    # The carrier assembler exports this same toolchain before it builds the
    # vc-frame WASI plugins. Keep provisioning out of rustup's ambient default:
    # a target installed there is invisible to cargo selected by RUSTUP_TOOLCHAIN.
    env:
      RUSTUP_TOOLCHAIN: "1.97.0"
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      terminal_sha: ${{ steps.build.outputs.terminal_sha }}
      frame_sha: ${{ steps.build.outputs.frame_sha }}
      request_id: ${{ steps.request.outputs.request_id }}
      release_signing: ${{ steps.request.outputs.release_signing }}
    steps:
      - name: Validate immutable release request
        id: request
        shell: bash
        env:
          VC_REQUEST_SOURCE: ${{ inputs.source_ref || github.sha }}
          VC_REQUEST_TERMINAL: ${{ inputs.terminal_revision }}
          VC_REQUEST_FRAME: ${{ inputs.frame_revision }}
          VC_REQUEST_ID: ${{ inputs.request_id }}
          VC_REQUEST_SIGNING: ${{ inputs.release_signing || false }}
        run: |
          set -euo pipefail
          source="${VC_REQUEST_SOURCE}"
          terminal="${VC_REQUEST_TERMINAL}"
          frame="${VC_REQUEST_FRAME}"
          request="${VC_REQUEST_ID}"
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_ref must be a full immutable Git SHA" >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$terminal" =~ ^[0-9a-f]{40}$ ]] || {
              echo "terminal_revision must be a full Git SHA" >&2
              exit 1
            }
            [[ "$frame" =~ ^[0-9a-f]{40}$ ]] || {
              echo "frame_revision must be a full Git SHA" >&2
              exit 1
            }
            [[ "$request" =~ ^[0-9a-f]{24}$ ]] || {
              echo "request_id must be 24 lowercase hex characters" >&2
              exit 1
            }
          fi
          sign=false
          if [[ "$GITHUB_REF_TYPE" == "tag" || ( "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$VC_REQUEST_SIGNING" == "true" ) ]]; then
            sign=true
          fi
          if [[ "$sign" == "true" && "$GITHUB_REPOSITORY" != "vetcoders/vibecrafted" ]]; then
            echo "product-signed Linux releases run in vetcoders/vibecrafted" >&2
            exit 1
          fi
          {
            echo "source_sha=$source"
            echo "terminal_sha=$terminal"
            echo "frame_sha=$frame"
            echo "request_id=$request"
            echo "release_signing=$sign"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.request.outputs.source_sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Runtime Pack build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake libclang-dev libprotobuf-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            protobuf-compiler rsync
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" \
            wasm32-unknown-unknown wasm32-wasip1
          for target in wasm32-unknown-unknown wasm32-wasip1; do
            rustup target list --installed --toolchain "$RUSTUP_TOOLCHAIN" \
              | grep -Fx "$target" >/dev/null \
              || { echo "FATAL: $target missing from $RUSTUP_TOOLCHAIN" >&2; exit 1; }
          done
          curl -L --proto '=https' --tlsv1.2 -sSf \
            -o /tmp/install-binstall.sh \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh
          bash /tmp/install-binstall.sh
          cargo binstall -y cargo-leptos
          lock_version="$(cargo tree --locked --manifest-path vibecrafted-server/Cargo.toml -p wasm-bindgen --depth 0 --prefix none | awk 'NR == 1 { sub(/^v/, "", $2); print $2 }')"
          cargo binstall -y "wasm-bindgen-cli@${lock_version}"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Build and sign the exact-source CI carrier
        id: build
        env:
          VC_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          VC_TERMINAL_SHA: ${{ steps.request.outputs.terminal_sha }}
          VC_FRAME_SHA: ${{ steps.request.outputs.frame_sha }}
          VC_RELEASE_MODE: ${{ steps.request.outputs.release_signing }}
          VC_PLATFORM: linux-x64
          VC_RELEASE_SIGNING_KEY: ${{ steps.request.outputs.release_signing == 'true' && secrets.VC_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          umask 077
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$VC_SOURCE_SHA" ]] || {
            echo "checkout did not resolve to the requested product source" >&2
            exit 1
          }
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$VC_RELEASE_MODE" == "true" ]]; then
            # Canonical carrier name, same stem Windows publishes.
            pack="$RUNNER_TEMP/Vibecrafted_RuntimePack_${version}-$(date -u +%Y%m%d)-${VC_SOURCE_SHA:0:8}-${VC_PLATFORM}.tar.gz"
          else
            pack="$RUNNER_TEMP/Vibecrafted_RuntimePack_linux-x64.tar.gz"
          fi
          VIBECRAFTED_SOURCE_OWNER_REPO="$GITHUB_REPOSITORY" \
            VIBECRAFTED_SOURCE_REVISION="$VC_SOURCE_SHA" \
            VIBECRAFTED_TERMINAL_REVISION="$VC_TERMINAL_SHA" \
            VIBECRAFTED_FRAME_REVISION="$VC_FRAME_SHA" \
            bash scripts/build-linux-runtime-pack.sh "$pack"
          product_pub="vibecrafted-core/vibecrafted_core/trust/vibecrafted-signing-v1.pub"
          if [[ "$VC_RELEASE_MODE" == "true" ]]; then
            [[ -n "${VC_RELEASE_SIGNING_KEY:-}" ]] || {
              echo "production builds require the configured VC_SIGNING_KEY" >&2
              exit 1
            }
            export VC_RELEASE_KEY
            VC_RELEASE_KEY="$(mktemp "$RUNNER_TEMP/linux-release-key.XXXXXX")"
            trap 'rm -f "$VC_RELEASE_KEY"' EXIT
            # printf, not a nested heredoc: bash parses << even in a branch
            # this rehearsal run does not take, and an indented terminator
            # never closes. '%s' keeps the PEM bytes unchanged.
            printf '%s' "$VC_RELEASE_SIGNING_KEY" > "$VC_RELEASE_KEY"
            unset VC_RELEASE_SIGNING_KEY
            openssl dgst -sha256 -sign "$VC_RELEASE_KEY" -out "$pack.sig" "$pack"
            rm -f "$VC_RELEASE_KEY"
            openssl dgst -sha256 -verify "$product_pub" -signature "$pack.sig" "$pack"
          else
            # dgst -sha256 -sign/-verify is RSA (or ECDSA), not Ed25519.
            # OpenSSL 3 rejects "Key type not supported" for ED25519+SHA-256.
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
              -out "$RUNNER_TEMP/ci-signing.key"
            openssl pkey -in "$RUNNER_TEMP/ci-signing.key" -pubout \
              -out "$RUNNER_TEMP/ci-signing.pub"
            openssl dgst -sha256 -sign "$RUNNER_TEMP/ci-signing.key" \
              -out "$pack.sig" "$pack"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/ci-signing.pub" \
              -signature "$pack.sig" "$pack"
            rm -f "$RUNNER_TEMP/ci-signing.key"
          fi
          python3 - "$pack" "$VC_SOURCE_SHA" "$VC_TERMINAL_SHA" "$VC_FRAME_SHA" "$VC_PLATFORM" <<'PY'
          import json, os, sys, tarfile
          pack, source, terminal, frame, platform = sys.argv[1:]
          with tarfile.open(pack, "r:gz") as archive:
              members = [
                  member for member in archive.getmembers()
                  if member.name == "VibecraftedRuntime/runtime-pack-provenance.json"
              ]
              if len(members) != 1 or not members[0].isfile():
                  raise SystemExit("missing Runtime Pack provenance")
              provenance = json.load(archive.extractfile(members[0]))
          revisions = provenance.get("source_revisions") or {}
          if provenance.get("platform") != platform:
              raise SystemExit("Runtime Pack platform disagrees with the build host")
          if terminal and revisions.get("vc-terminal") != terminal:
              raise SystemExit("Runtime Pack vc-terminal revision disagrees with the request")
          if frame and revisions.get("vc-frame") != frame:
              raise SystemExit("Runtime Pack vc-frame revision disagrees with the request")
          if revisions.get("vibecrafted") != source:
              raise SystemExit("Runtime Pack source revision disagrees with the request")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"terminal_sha={revisions['vc-terminal']}\n")
              handle.write(f"frame_sha={revisions['vc-frame']}\n")
          PY
          stage="$RUNNER_TEMP/linux-x64-carrier"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$pack" "$pack.sha256" "$pack.sig" "$stage/"
          if [[ "$VC_RELEASE_MODE" != "true" ]]; then
            cp "$RUNNER_TEMP/ci-signing.pub" "$stage/ci-signing.pub"
          fi

      - name: Scrub release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP"/linux-release-key.*

      - name: Upload the verified CI carrier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64-runtime-pack
          path: ${{ runner.temp }}/linux-x64-carrier/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Ubuntu 22.04 / 24.04 — runner-native. Tests the happy path.
  # ---------------------------------------------------------------------------
  ubuntu-native:
    name: install.sh (ubuntu-${{ matrix.runner-version }})
    needs: linux-runtime-pack
    env:
      # `cargo install aicx` is memory-heavy; keep CI runners from OOM-killing rustc.
      CARGO_BUILD_JOBS: "1"
      # Named waiver under the hard-fail foundations contract (Vetcoders decision,
      # 2026-10-06): prebuilt Loctree channel binaries do not run on jammy's
      # glibc 2.35 ("missing or broken" right after a successful npm install).
      # Waive ONLY 22.04; 24.04 keeps the hard default and proves the
      # channels. Channel gap tracked in ~/.vibecrafted/vibecrafted-fail.md.
      REQUIRE_FOUNDATIONS: ${{ matrix.runner-version == 'ubuntu-22.04' && '0' || '1' }}
    strategy:
      fail-fast: false
      matrix:
        runner-version: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner-version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.linux-runtime-pack.outputs.source_sha }}

      - name: Show platform fingerprint
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          bash --version | head -1

      - name: Lint install.sh with shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n install.sh
          # The project excludes SC1091 (sourced env files we don't follow)
          # in scripts/check_shell.py — match that policy here.
          shellcheck -e SC1090,SC1091 install.sh

      # ubuntu-22.04 ships system Python 3.10, below the project floor
      # (requires-python >=3.11; vibecrafted_core imports tomllib, 3.11+ stdlib).
      # Pin a supported interpreter so `make install` runs on a version the code
      # actually targets, while the matrix still covers 22.04 vs 24.04 os-release.
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Download the exact-source Runtime Pack
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-x64-runtime-pack
          path: ${{ runner.temp }}/runtime-pack

      - name: Install make + python3 (already present, but be explicit)
        run: |
          set -euo pipefail
          # protobuf-compiler is required by `cargo install aicx` because the
          # transitive `lance-encoding` crate uses `prost-build`, which shells
          # out to `protoc` at build time. Without it the install fails with
          # "Could not find `protoc`". apt-get update already ran in the
          # lint step above for this job.
          # libgtk-3-dev + libxdo-dev + appindicator: `make install` builds the
          # `voc` app binary, whose dependency graph pulls tray-icon/muda ->
          # gtk-sys/glib-sys on Linux. libgtk-3-dev transitively provides the
          # glib-2.0/gdk/pango/cairo/atk pkg-config files the build needs.
          sudo apt-get install -y \
            build-essential \
            cmake \
            libclang-dev \
            libprotobuf-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            make \
            protobuf-compiler \
            python3 \
            python3-venv

      - name: Install the verified exact-source Runtime Pack
        env:
          VC_SOURCE_SHA: ${{ needs.linux-runtime-pack.outputs.source_sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/runtime-pack"
          mapfile -t packs < <(find "$dir" -maxdepth 1 -type f -name 'Vibecrafted_RuntimePack_*.tar.gz' ! -name '*.sha256' | sort)
          [[ ${#packs[@]} -eq 1 ]] || {
            echo "expected one Linux Runtime Pack, found ${#packs[@]}" >&2
            exit 1
          }
          pack="${packs[0]}"
          # install.sh needs the full closed tuple: without --archive-file it
          # resolves the channel manifest, which does not bind CI branches
          # (W4 refusal). Write the exact-source carrier archive from this
          # checkout; the writer proves every byte against the pack's source.
          archive="$RUNNER_TEMP/vibecrafted-src.tar.gz"
          python3 scripts/distribution_manifest.py archive \
            --source . --output "$archive" --root-name vibecrafted \
            --owner-repo "$GITHUB_REPOSITORY" --source-revision "$VC_SOURCE_SHA"
          pub="$dir/ci-signing.pub"
          if [[ ! -f "$pub" ]]; then
            pub="$GITHUB_WORKSPACE/vibecrafted-core/vibecrafted_core/trust/vibecrafted-signing-v1.pub"
          fi
          VIBECRAFTED_RUNTIME_PACK_PUBLIC_KEY="$pub" \
            bash install.sh --archive-file "$archive" --runtime-pack-file "$pack" install

      - name: Run vibecrafted doctor
        run: |
          set -euo pipefail
          # PATH adjustments mirror what the install.sh interactive path does
          # — make sure the staged CLI is visible to this step. Foundations
          # come from their own channels: loct/aicx from npm (its global bin),
          # prview from its GitHub release and screenscribe through uv/pipx
          # (both ~/.local/bin); a channel CI cannot reach stays a warning.
          export PATH="$HOME/.vibecrafted/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/share/vibecrafted/bin:$PATH"
          if command -v vibecrafted >/dev/null 2>&1; then
            # Neutral cwd: the deck resolves core via `python -m`, and a
            # checkout cwd shadows the installed (stamped) package tree with
            # the living tree — the launcher check rightly flags that as
            # unstamped. Real users run doctor from anywhere; so does CI.
            (cd "${RUNNER_TEMP:-/tmp}" && vibecrafted doctor)
          else
            # Fallback to the in-repo Makefile target if the staged CLI
            # isn't on PATH yet (smoke uses the repo source tree).
            make doctor
          fi
          # Doctor warnings cannot admit a missing or ABI-incompatible owned
          # engine. Probe the selected installed generation, bypassing PATH.
          generation="${XDG_DATA_HOME:-$HOME/.local/share}/vibecrafted/releases/$(tr -d '[:space:]' < VERSION)"
          for donor in vc-frame vc-terminal; do
            "$generation/bin/$donor" --version
          done

      - name: Run skill-loader smoke
        # Installed-runtime health is the immediately preceding owned gate.
        # Keep this step focused on skill loading before installer fixtures.
        run: bash tests/skill_loader_smoke.sh --doctor-preverified

      - name: Run install.sh / install.ps1 host smoke
        run: make test-install

  # ---------------------------------------------------------------------------
  # Debian 12 (Bookworm) — bare container. Tests the prereq pre-flight + hints.
  # ---------------------------------------------------------------------------
  debian-bookworm-container:
    name: install.sh (debian-12 container)
    needs: linux-runtime-pack
    runs-on: ubuntu-latest
    env:
      # debian:bookworm-slim runs with limited memory inside the job container.
      CARGO_BUILD_JOBS: "1"
      # Named waiver under the hard-fail foundations contract (Vetcoders decision,
      # 2026-10-06): bookworm's glibc 2.36 cannot run the prebuilt Loctree and
      # prview channel binaries. Channel gap (glibc baseline of the Rust
      # builds) tracked in ~/.vibecrafted/vibecrafted-fail.md.
      REQUIRE_FOUNDATIONS: "0"
    container:
      image: debian:bookworm-slim
    # bare debian:bookworm-slim ships dash as /bin/sh and no bash. The first
    # step installs bash; every subsequent step then runs under bash so the
    # existing `set -euo pipefail` boilerplate works as written.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install bare-minimum container deps
        # This step runs before bash is installed; pin it to sh and drop
        # `pipefail` (dash does not support it). Once apt-get pulls bash,
        # the job default kicks in for every later step.
        shell: sh
        run: |
          set -eu
          apt-get update
          # Match the pre-flight: tar + make + python3 + curl + file + ca-certs.
          # bash + coreutils are already present in debian-slim.
          # protobuf-compiler is required by `cargo install aicx` because the
          # transitive `lance-encoding` crate uses `prost-build`, which shells
          # out to `protoc` at build time.
          # libgtk-3-dev + libxdo-dev + appindicator: `make install` builds the
          # `voc` app binary (tray-icon/muda -> gtk-sys/glib-sys on Linux).
          # libgtk-3-dev transitively provides glib-2.0/gdk/pango/cairo/atk.
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            build-essential \
            cmake \
            curl \
            file \
            git \
            libclang-dev \
            libprotobuf-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            make \
            protobuf-compiler \
            python3 \
            python3-venv \
            shellcheck \
            sudo \
            tar

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.linux-runtime-pack.outputs.source_sha }}

      - name: Download the exact-source Runtime Pack
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-x64-runtime-pack
          path: /tmp/runtime-pack

      - name: Show platform fingerprint
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          bash --version | head -1

      - name: Lint install.sh with shellcheck
        run: |
          set -euo pipefail
          bash -n install.sh
          shellcheck -e SC1090,SC1091 install.sh

      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh -o uv-install.sh && sh uv-install.sh
          # Persist for downstream steps in this job
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # debian:bookworm-slim ships no Rust toolchain. `make install` builds the
      # voc/vc-admin/vc-server binaries from source, so install cargo here. The
      # GitHub-hosted ubuntu runners have Rust preinstalled; only the container
      # needs this.
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh && sh rustup-init.sh -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the verified exact-source Runtime Pack
        env:
          VC_SOURCE_SHA: ${{ needs.linux-runtime-pack.outputs.source_sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          # actions/checkout registers safe.directory only in a TEMPORARY git
          # config (under an overridden HOME); this step's git calls run with
          # the job HOME and hit "dubious ownership" on the mounted workspace.
          git config --global --add safe.directory "$(pwd)"
          dir="/tmp/runtime-pack"
          mapfile -t packs < <(find "$dir" -maxdepth 1 -type f -name 'Vibecrafted_RuntimePack_*.tar.gz' ! -name '*.sha256' | sort)
          [[ ${#packs[@]} -eq 1 ]] || {
            echo "expected one Linux Runtime Pack, found ${#packs[@]}" >&2
            exit 1
          }
          pack="${packs[0]}"
          # Same closed-tuple requirement as the ubuntu jobs: hand install.sh
          # the exact-source carrier archive written from this checkout.
          archive="/tmp/vibecrafted-src.tar.gz"
          python3 scripts/distribution_manifest.py archive \
            --source . --output "$archive" --root-name vibecrafted \
            --owner-repo "$GITHUB_REPOSITORY" --source-revision "$VC_SOURCE_SHA"
          pub="$dir/ci-signing.pub"
          if [[ ! -f "$pub" ]]; then
            pub="$GITHUB_WORKSPACE/vibecrafted-core/vibecrafted_core/trust/vibecrafted-signing-v1.pub"
          fi
          VIBECRAFTED_RUNTIME_PACK_PUBLIC_KEY="$pub" \
            bash install.sh --archive-file "$archive" --runtime-pack-file "$pack" install

      - name: Run vibecrafted doctor
        run: |
          set -euo pipefail
          export PATH="$HOME/.vibecrafted/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/share/vibecrafted/bin:$PATH"
          if command -v vibecrafted >/dev/null 2>&1; then
            # Neutral cwd: the deck resolves core via `python -m`, and a
            # checkout cwd shadows the installed (stamped) package tree with
            # the living tree — the launcher check rightly flags that as
            # unstamped. Real users run doctor from anywhere; so does CI.
            (cd "${RUNNER_TEMP:-/tmp}" && vibecrafted doctor)
          else
            make doctor
          fi
          generation="${XDG_DATA_HOME:-$HOME/.local/share}/vibecrafted/releases/$(tr -d '[:space:]' < VERSION)"
          for donor in vc-frame vc-terminal; do
            "$generation/bin/$donor" --version
          done

      - name: Run skill-loader smoke
        run: |
          set -euo pipefail
          export PATH="$HOME/.vibecrafted/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/share/vibecrafted/bin:$PATH"
          # Installed-runtime health is the immediately preceding owned gate.
          bash tests/skill_loader_smoke.sh --doctor-preverified

      - name: Run install.sh / install.ps1 host smoke
        run: |
          set -euo pipefail
          export PATH="$HOME/.vibecrafted/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/share/vibecrafted/bin:$PATH"
          make test-install

  # ---------------------------------------------------------------------------
  # Docker build smoke — verifies the shipped Dockerfile still builds and
  # that `vibecrafted doctor` runs at build time. Separate job to keep
  # signal isolated from the host-native install paths above.
  # ---------------------------------------------------------------------------
  docker-build-smoke:
    name: docker build + doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv for VM context test
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Verify hardened VM carrier build context
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/vibecrafted-vm-context-venv
          VIBECRAFTED_HOME: ${{ runner.temp }}/vibecrafted-vm-context-home
        run: |
          env -u PYTHONPATH uv run --project vibecrafted-core \
            --with pytest --with docker==7.1.0 python -m pytest -q \
            tests/tui/test_linux_arm64_runtime_pack.py::test_vm_docker_context_admits_only_exact_runtime_pack_archives

      - name: Build vibecrafted:ci-smoke
        run: docker build -t vibecrafted:ci-smoke .

      - name: Verify CLI inside container
        run: |
          set -euo pipefail
          docker run --rm vibecrafted:ci-smoke version
          # Run doctor; allow non-zero so we get the report in CI logs,
          # but require the image build itself to have succeeded above.
          docker run --rm vibecrafted:ci-smoke doctor || \
            echo "[ci] container doctor non-zero — captured for review"

  linux-x64-release:
    name: Collect product-signed tested Linux x64 release
    if: github.event_name == 'workflow_dispatch' && inputs.release_signing
    needs:
      - linux-runtime-pack
      - ubuntu-native
      - debian-bookworm-container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Receipt tooling belongs to the workflow controller; the pack and the
      # install jobs above checked out the requested product source.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-x64-runtime-pack
          path: release

      - name: Bind and product-sign the successful native release
        shell: bash
        env:
          VC_SOURCE_SHA: ${{ needs.linux-runtime-pack.outputs.source_sha }}
          VC_TERMINAL_SHA: ${{ needs.linux-runtime-pack.outputs.terminal_sha }}
          VC_FRAME_SHA: ${{ needs.linux-runtime-pack.outputs.frame_sha }}
          VC_REQUEST_ID: ${{ needs.linux-runtime-pack.outputs.request_id }}
          VC_CONTROLLER_SHA: ${{ github.sha }}
          VC_REPOSITORY: ${{ github.repository }}
          VC_UBUNTU_RESULT: ${{ needs.ubuntu-native.result }}
          VC_DEBIAN_RESULT: ${{ needs.debian-bookworm-container.result }}
          VC_RELEASE_SIGNING_KEY: ${{ secrets.VC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          export VC_RELEASE_KEY
          VC_RELEASE_KEY="$(mktemp "$RUNNER_TEMP/linux-release-key.XXXXXX")"
          trap 'rm -f "$VC_RELEASE_KEY"' EXIT
          python3 - <<'PY_KEY'
          import os
          from pathlib import Path
          secret = os.environ.get("VC_RELEASE_SIGNING_KEY", "")
          if not secret:
              raise SystemExit("configured product signing key is unavailable")
          Path(os.environ["VC_RELEASE_KEY"]).write_text(secret, encoding="ascii")
          PY_KEY
          unset VC_RELEASE_SIGNING_KEY
          python3 scripts/linux_release_manifest.py \
            --directory release \
            --public-key vibecrafted-core/vibecrafted_core/trust/vibecrafted-signing-v1.pub \
            --platform linux-x64 \
            --source-sha "$VC_SOURCE_SHA" --terminal-sha "$VC_TERMINAL_SHA" \
            --frame-sha "$VC_FRAME_SHA" --controller-sha "$VC_CONTROLLER_SHA" \
            --repository "$VC_REPOSITORY" --request-id "$VC_REQUEST_ID" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --ubuntu-native "$VC_UBUNTU_RESULT" --debian-12 "$VC_DEBIAN_RESULT"
          openssl dgst -sha256 -sign "$VC_RELEASE_KEY" \
            -out release/linux-x64-release.json.sig release/linux-x64-release.json
          openssl dgst -sha256 \
            -verify vibecrafted-core/vibecrafted_core/trust/vibecrafted-signing-v1.pub \
            -signature release/linux-x64-release.json.sig release/linux-x64-release.json

      - name: Upload verified native Linux x64 release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64-release
          compression-level: 0
          retention-days: 7
          path: |
            release/Vibecrafted_RuntimePack_*-linux-x64.tar.gz
            release/Vibecrafted_RuntimePack_*-linux-x64.tar.gz.sig
            release/Vibecrafted_RuntimePack_*-linux-x64.tar.gz.sha256
            release/linux-x64-release.json
            release/linux-x64-release.json.sig
          if-no-files-found: error

  # linux-arm64 is the same carrier pipeline on a glibc-2.35 ARM runner.
  # It stays opt-in: a missing ARM runner must not block the x64 publication
  # Debian x64 installs are waiting on.
  linux-arm64-runtime-pack:
    name: build Linux arm64 Runtime Pack
    if: github.event_name == 'workflow_dispatch' && inputs.release_signing && inputs.include_arm64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: "1.97.0"
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      terminal_sha: ${{ steps.build.outputs.terminal_sha }}
      frame_sha: ${{ steps.build.outputs.frame_sha }}
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - name: Validate immutable release request
        id: request
        shell: bash
        env:
          VC_REQUEST_SOURCE: ${{ inputs.source_ref }}
          VC_REQUEST_TERMINAL: ${{ inputs.terminal_revision }}
          VC_REQUEST_FRAME: ${{ inputs.frame_revision }}
          VC_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$VC_REQUEST_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$VC_REQUEST_TERMINAL" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$VC_REQUEST_FRAME" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$VC_REQUEST_ID" =~ ^[0-9a-f]{24}$ ]] || exit 1
          if [[ "$GITHUB_REPOSITORY" != "vetcoders/vibecrafted" ]]; then
            echo "product-signed Linux releases run in vetcoders/vibecrafted" >&2
            exit 1
          fi
          {
            echo "source_sha=$VC_REQUEST_SOURCE"
            echo "terminal_sha=$VC_REQUEST_TERMINAL"
            echo "frame_sha=$VC_REQUEST_FRAME"
            echo "request_id=$VC_REQUEST_ID"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.request.outputs.source_sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Runtime Pack build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake libclang-dev libprotobuf-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            protobuf-compiler rsync
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" \
            wasm32-unknown-unknown wasm32-wasip1
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -L --proto '=https' --tlsv1.2 -sSf \
            -o /tmp/install-binstall.sh \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh
          bash /tmp/install-binstall.sh
          cargo binstall -y cargo-leptos
          lock_version="$(cargo tree --locked --manifest-path vibecrafted-server/Cargo.toml -p wasm-bindgen --depth 0 --prefix none | awk 'NR == 1 { sub(/^v/, "", $2); print $2 }')"
          cargo binstall -y "wasm-bindgen-cli@${lock_version}"

      - name: Build and product-sign the arm64 carrier
        id: build
        env:
          VC_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          VC_TERMINAL_SHA: ${{ steps.request.outputs.terminal_sha }}
          VC_FRAME_SHA: ${{ steps.request.outputs.frame_sha }}
          VC_PLATFORM: linux-arm64
          VC_RELEASE_SIGNING_KEY: ${{ secrets.VC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          [[ "$(git rev-parse HEAD)" == "$VC_SOURCE_SHA" ]] || exit 1
          [[ "$(uname -m)" == "aarch64" ]] || {
            echo "linux-arm64 carrier must be built on aarch64" >&2
            exit 1
          }
          version="$(tr -d '[:space:]' < VERSION)"
          pack="$RUNNER_TEMP/Vibecrafted_RuntimePack_${version}-$(date -u +%Y%m%d)-${VC_SOURCE_SHA:0:8}-${VC_PLATFORM}.tar.gz"
          VIBECRAFTED_SOURCE_OWNER_REPO="$GITHUB_REPOSITORY" \
            VIBECRAFTED_SOURCE_REVISION="$VC_SOURCE_SHA" \
            VIBECRAFTED_TERMINAL_REVISION="$VC_TERMINAL_SHA" \
            VIBECRAFTED_FRAME_REVISION="$VC_FRAME_SHA" \
            bash scripts/build-linux-runtime-pack.sh "$pack"
          [[ -n "${VC_RELEASE_SIGNING_KEY:-}" ]] || {
            echo "production builds require the configured VC_SIGNING_KEY" >&2
            exit 1
          }
          export VC_RELEASE_KEY
          VC_RELEASE_KEY="$(mktemp "$RUNNER_TEMP/linux-arm64-release-key.XXXXXX")"
          trap 'rm -f "$VC_RELEASE_KEY"' EXIT
          python3 - <<'PY_KEY'
          import os
          from pathlib import Path
          Path(os.environ["VC_RELEASE_KEY"]).write_text(
              os.environ["VC_RELEASE_SIGNING_KEY"], encoding="ascii"
          )
          PY_KEY
          unset VC_RELEASE_SIGNING_KEY
          product_pub="vibecrafted-core/vibecrafted_core/trust/vibecrafted-signing-v1.pub"
          openssl dgst -sha256 -sign "$VC_RELEASE_KEY" -out "$pack.sig" "$pack"
          rm -f "$VC_RELEASE_KEY"
          openssl dgst -sha256 -verify "$product_pub" -signature "$pack.sig" "$pack"
          python3 - "$pack" "$VC_SOURCE_SHA" "$VC_PLATFORM" <<'PY'
          import json, os, sys, tarfile
          pack, source, platform = sys.argv[1:]
          with tarfile.open(pack, "r:gz") as archive:
              members = [
                  member for member in archive.getmembers()
                  if member.name == "VibecraftedRuntime/runtime-pack-provenance.json"
              ]
              if len(members) != 1:
                  raise SystemExit("missing Runtime Pack provenance")
              provenance = json.load(archive.extractfile(members[0]))
          revisions = provenance["source_revisions"]
          if provenance.get("platform") != platform or revisions.get("vibecrafted") != source:
              raise SystemExit("arm64 Runtime Pack provenance disagrees with the request")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"terminal_sha={revisions['vc-terminal']}\n")
              handle.write(f"frame_sha={revisions['vc-frame']}\n")
          PY
          stage="$RUNNER_TEMP/linux-arm64-carrier"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$pack" "$pack.sha256" "$pack.sig" "$stage/"

      - name: Scrub release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP"/linux-arm64-release-key.*

      - name: Upload the product-signed arm64 carrier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-runtime-pack
          path: ${{ runner.temp }}/linux-arm64-carrier/
          if-no-files-found: error

  linux-arm64-cold-install:
    name: install.sh (ubuntu-22.04-arm)
    needs: linux-arm64-runtime-pack
    if: github.event_name == 'workflow_dispatch' && inputs.release_signing && inputs.include_arm64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.linux-arm64-runtime-pack.outputs.source_sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-arm64-runtime-pack
          path: ${{ runner.temp }}/runtime-pack

      - name: Install the product-signed arm64 Runtime Pack
        env:
          VC_SOURCE_SHA: ${{ needs.linux-arm64-runtime-pack.outputs.source_sha }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libclang-dev libprotobuf-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev make protobuf-compiler \
            python3 python3-venv
          dir="$RUNNER_TEMP/runtime-pack"
          mapfile -t packs < <(find "$dir" -maxdepth 1 -type f -name 'Vibecrafted_RuntimePack_*-linux-arm64.tar.gz' | sort)
          [[ ${#packs[@]} -eq 1 ]]
          pack="${packs[0]}"
          archive="$RUNNER_TEMP/vibecrafted-src.tar.gz"
          python3 scripts/distribution_manifest.py archive \
            --source . --output "$archive" --root-name vibecrafted \
            --owner-repo "$GITHUB_REPOSITORY" --source-revision "$VC_SOURCE_SHA"
          VIBECRAFTED_RUNTIME_PACK_PUBLIC_KEY="$GITHUB_WORKSPACE/vibecrafted-core/vibecrafted_core/trust/vibecrafted-signing-v1.pub" \
            bash install.sh --archive-file "$archive" --runtime-pack-file "$pack" install
          export PATH="$HOME/.vibecrafted/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/share/vibecrafted/bin:$PATH"
          generation="${XDG_DATA_HOME:-$HOME/.local/share}/vibecrafted/releases/$(tr -d '[:space:]' < VERSION)"
          (cd "${RUNNER_TEMP:-/tmp}" && vibecrafted doctor)
          for donor in vc-frame vc-terminal; do
            "$generation/bin/$donor" --version
          done

  linux-arm64-release:
    name: Collect product-signed tested Linux arm64 release
    if: github.event_name == 'workflow_dispatch' && inputs.release_signing && inputs.include_arm64
    needs:
      - linux-arm64-runtime-pack
      - linux-arm64-cold-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-arm64-runtime-pack
          path: release

      - name: Bind and product-sign the successful arm64 release
        shell: bash
        env:
          VC_SOURCE_SHA: ${{ needs.linux-arm64-runtime-pack.outputs.source_sha }}
          VC_TERMINAL_SHA: ${{ needs.linux-arm64-runtime-pack.outputs.terminal_sha }}
          VC_FRAME_SHA: ${{ needs.linux-arm64-runtime-pack.outputs.frame_sha }}
          VC_REQUEST_ID: ${{ needs.linux-arm64-runtime-pack.outputs.request_id }}
          VC_CONTROLLER_SHA: ${{ github.sha }}
          VC_REPOSITORY: ${{ github.repository }}
          VC_NATIVE_RESULT: ${{ needs.linux-arm64-cold-install.result }}
          VC_RELEASE_SIGNING_KEY: ${{ secrets.VC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          export VC_RELEASE_KEY
          VC_RELEASE_KEY="$(mktemp "$RUNNER_TEMP/linux-arm64-receipt-key.XXXXXX")"
          trap 'rm -f "$VC_RELEASE_KEY"' EXIT
          python3 - <<'PY_KEY'
          import os
          from pathlib import Path
          secret = os.environ.get("VC_RELEASE_SIGNING_KEY", "")
          if not secret:
              raise SystemExit("configured product signing key is unavailable")
          Path(os.environ["VC_RELEASE_KEY"]).write_text(secret, encoding="ascii")
          PY_KEY
          unset VC_RELEASE_SIGNING_KEY
          python3 scripts/linux_release_manifest.py \
            --directory release --platform linux-arm64 \
            --public-key vibecrafted-core/vibecrafted_core/trust/vibecrafted-signing-v1.pub \
            --source-sha "$VC_SOURCE_SHA" --terminal-sha "$VC_TERMINAL_SHA" \
            --frame-sha "$VC_FRAME_SHA" --controller-sha "$VC_CONTROLLER_SHA" \
            --repository "$VC_REPOSITORY" --request-id "$VC_REQUEST_ID" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --native-install "$VC_NATIVE_RESULT"
          openssl dgst -sha256 -sign "$VC_RELEASE_KEY" \
            -out release/linux-arm64-release.json.sig release/linux-arm64-release.json
          openssl dgst -sha256 \
            -verify vibecrafted-core/vibecrafted_core/trust/vibecrafted-signing-v1.pub \
            -signature release/linux-arm64-release.json.sig release/linux-arm64-release.json

      - name: Upload verified native Linux arm64 release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-release
          compression-level: 0
          retention-days: 7
          path: |
            release/Vibecrafted_RuntimePack_*-linux-arm64.tar.gz
            release/Vibecrafted_RuntimePack_*-linux-arm64.tar.gz.sig
            release/Vibecrafted_RuntimePack_*-linux-arm64.tar.gz.sha256
            release/linux-arm64-release.json
            release/linux-arm64-release.json.sig
          if-no-files-found: error
